<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Stream Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .wrap { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; }
    video { width: 100%; height: 100%; object-fit: contain; }
    .badge { position: absolute; top: 14px; left: 14px; background: rgba(0,0,0,0.85); color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 8px; z-index: 10; pointer-events: none; border: 1px solid rgba(255,255,255,0.2); }
    .dot { width: 8px; height: 8px; background: #ef4444; border-radius: 50%; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .play-btn { position: absolute; z-index: 20; background: #ef4444; color: #fff; border: none; padding: 16px 36px; border-radius: 50px; font-size: 17px; font-weight: bold; cursor: pointer; display: none; box-shadow: 0 4px 20px rgba(239,68,68,0.5); }
    .play-btn:hover { background: #dc2626; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="badge"><span class="dot"></span><span id="st">Loading Live...</span></div>
    <button class="play-btn" id="pBtn" onclick="userClickPlay()">▶ Click to Play</button>
    <video id="v" controls autoplay playsinline></video>
  </div>
  <script>
    const I18N = {
      en: {
        loading: "Loading Live...",
        play: "▶ Click to Play",
        live: "LIVE",
        clickPlay: "Click Play Button",
        reconnecting: "Reconnecting...",
        offline: "Stream Offline"
      },
      bn: {
        loading: "লাইভ লোড হচ্ছে...",
        play: "▶ ক্লিক করে চালান",
        live: "লাইভ চলছে",
        clickPlay: "প্লে বাটনে ক্লিক করুন",
        reconnecting: "রিকানেক্ট হচ্ছে...",
        offline: "স্ট্রিম অফলাইন বা শেষ হয়েছে"
      },
      es: {
        loading: "Cargando en vivo...",
        play: "▶ Clic para reproducir",
        live: "EN VIVO",
        clickPlay: "Haz clic en reproducir",
        reconnecting: "Reconectando...",
        offline: "Transmisión sin conexión"
      },
      ar: {
        loading: "جارٍ تحميل البث...",
        play: "▶ انقر للتشغيل",
        live: "مباشر",
        clickPlay: "انقر على زر التشغيل",
        reconnecting: "إعادة الاتصال...",
        offline: "البث متوقف"
      },
      hi: {
        loading: "लाइव लोड हो रहा है...",
        play: "▶ चलाने के लिए क्लिक करें",
        live: "लाइव चल रहा है",
        clickPlay: "प्ले बटन पर क्लिक करें",
        reconnecting: "पुनः कनेक्ट हो रहा है...",
        offline: "स्ट्रीम ऑफलाइन है"
      },
      pt: {
        loading: "Carregando ao vivo...",
        play: "▶ Clique para reproduzir",
        live: "AO VIVO",
        clickPlay: "Clique no botão de play",
        reconnecting: "Reconectando...",
        offline: "Transmissão offline"
      },
      fr: {
        loading: "Chargement en direct...",
        play: "▶ Cliquez pour lire",
        live: "EN DIRECT",
        clickPlay: "Cliquez sur play",
        reconnecting: "Reconnexion...",
        offline: "Flux hors ligne"
      }
    };

    function getLang() {
      const userLang = (navigator.language || navigator.userLanguage || "en").toLowerCase();
      const code = userLang.split("-")[0];
      return I18N[code] ? code : "en";
    }

    const t = I18N[getLang()];

    const urlParams = new URLSearchParams(window.location.search);
    const streamUrl = urlParams.get('url') || "https://a121.azplay49.me/hls/streama269241/index.m3u8?cst=3e74aca8de8568fcd4e3b9863a0956e8";
    
    const video = document.getElementById('v');
    const st = document.getElementById('st');
    const pBtn = document.getElementById('pBtn');

    st.innerText = t.loading;
    pBtn.innerText = t.play;

    function userClickPlay() {
      video.play().then(() => {
        pBtn.style.display = 'none';
        st.innerText = t.live;
        st.style.color = '#4ade80';
      }).catch(e => console.error(e));
    }

    if (Hls.isSupported()) {
      const hls = new Hls({
        enableWorker: true,
        lowLatencyMode: true,
        backBufferLength: 30
      });

      hls.loadSource(streamUrl);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, function () {
        st.innerText = t.live;
        st.style.color = '#4ade80';
        video.play().catch(function() {
          pBtn.style.display = 'block';
          st.innerText = t.clickPlay;
          st.style.color = '#fbbf24';
        });
      });

      hls.on(Hls.Events.ERROR, function (e, data) {
        if (data.fatal) {
          if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
            st.innerText = t.reconnecting;
            hls.startLoad();
          } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
            hls.recoverMediaError();
          } else {
            st.innerText = t.offline;
            st.style.color = '#ef4444';
          }
        }
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = streamUrl;
      video.addEventListener('loadedmetadata', function () {
        video.play().catch(function() {
          pBtn.style.display = 'block';
        });
      });
    }
  </script>
</body>
</html>
